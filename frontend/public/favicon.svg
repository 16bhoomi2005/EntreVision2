<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="sproutGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Modern Rounded Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <!-- Glassy Inner Sheen -->
  <path d="M 4 18 C 4 8, 8 4, 18 4 L 46 4 C 56 4, 60 8, 60 18 L 60 26 C 36 28, 14 36, 4 48 Z" fill="white" opacity="0.12" />

  <!-- Agro Sprout Icon Symbol -->
  <g filter="url(#shadow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Stem -->
    <path d="M32 49 V31 C32 24 27 19 19 19 C19 28 25 33 32 34" fill="url(#sproutGrad)" stroke="#ffffff" stroke-width="2.5" />
    
    <!-- Right Golden/Citrus Leaf -->
    <path d="M32 31 C32 23 37 17 46 17 C46 26 40 32 32 33" fill="url(#leafGrad)" stroke="#ffffff" stroke-width="2.5" />

    <!-- Center Sprout Bud -->
    <circle cx="32" cy="18" r="3" fill="#ffffff" />
  </g>
</svg>